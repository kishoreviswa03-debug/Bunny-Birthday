</section>

<!-- ============ SECTION 7 — GARDEN ============ -->
<section id="garden">
  <div class="wrap">
    <h2 id="garden-title"></h2>
    <div class="garden-bunny">🐇</div>
    <div class="garden-plot" id="garden-plot"></div>
  </div>
</section>

<!-- ============ SECTION 8 — HOW WELL I KNOW YOU ============ -->
<section id="quiz">
  <div class="wrap">
    <h2 id="quiz-title"></h2>
    <p id="quiz-intro-text"></p>
    <div id="quiz-box">
      <div class="qa-list" id="qa-list"></div>
      <div id="quiz-final">
        <p id="quiz-result-text" style="font-weight:700;"></p>
        <p id="quiz-followup-text" style="opacity:.8;"></p>
        <button id="quiz-tell-btn"></button>
        <div id="quiz-reveal-text"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ SECTION 9 — WISHES ============ -->
<section id="wishes">
  <div class="wrap">
    <h2 id="wishes-title" style="color:#fff;">🌙</h2>
    <h2 id="wishes-title2" style="color:#fff;"></h2>
    <div class="wish-stars" id="wish-stars"></div>
  </div>
</section>

<!-- ============ SECTION 10 — SECRET BOX ============ -->
<section id="secret">
  <div class="wrap">
    <p id="secret-intro" style="font-family: var(--font-display); font-style:italic; font-size:20px;"></p>
    <div id="box-visual">🎁</div>
    <button id="box-btn"></button>
    <div id="box-message"></div>
  </div>
</section>

<!-- ============ FINAL SECTION ============ -->
<section id="final">
  <div class="wrap">
    <h2 id="final-title"></h2>
    <div class="sub" id="final-sub"></div>
    <div class="personal-msg" id="final-personal"></div>
    <div class="sig">
      <div id="final-sig1"></div>
      <div class="line2" id="final-sig2"></div>
    </div>
  </div>
</section>

<!-- ============ MUSIC BUTTON ============ -->
<button id="music-btn">🎵</button>
<div id="music-toast"></div>
<audio id="bgm" loop preload="none"></audio>

<!-- ============ SECRET EASTER-EGG SCREEN (type BUNNY) ============ -->
<div id="secret-screen">
  <div>
    <div style="font-size:50px;">🐰✨</div>
    <h2 style="color:#fff; margin-top:16px;">You found the secret screen.</h2>
    <p style="max-width:420px; margin: 14px auto 0; opacity:.85;">There's no real prize here — just this: I hope today feels exactly as good as you deserve.</p>
    <button class="close-secret" id="close-secret">close</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  const C = CONFIG;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Fill in text content from CONFIG ---------- */
  const setText = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };

  setText('reveal-title', C.revealTitle);
  document.getElementById('reveal-message').textContent = C.revealMessage;
  setText('why-title', C.whyBunnyTitle);
  setText('why-intro', C.whyBunnyIntro);
  setText('eyes-title', C.eyesTitle);
  setText('eyes-text', C.eyesText);
  setText('eyes-btn', C.eyesButton);
  setText('eyes-reply', C.eyesReply);
  setText('cherish-title', C.cherishTitle);
  setText('memories-title', C.memoriesTitle);
  setText('through-title', C.throughEyesTitle);
  setText('garden-title', C.gardenTitle);
  setText('quiz-title', C.quizTitle);
  setText('wishes-title2', C.wishesTitle);
  setText('secret-intro', C.secretIntro);
  setText('box-btn', C.secretButton);
  setText('final-title', C.finalTitle);
  setText('final-sub', C.finalSubtitle);
  document.getElementById('final-personal').textContent = C.finalPersonalMessage;
  setText('final-sig1', C.finalSignatureLine1);
  setText('final-sig2', C.finalSignatureLine2);
  document.title = "A Little Universe for " + C.nickname;

  /* ---------- Lock gate: is it her birthday yet? ---------- */
  function daysUntilBirthday(){
    if(!C.birthdayMonth || !C.birthdayDay) return null;
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let target = new Date(now.getFullYear(), C.birthdayMonth - 1, C.birthdayDay);
    let diff = Math.round((target - today) / 86400000);
    if(diff < 0){
      target = new Date(now.getFullYear()+1, C.birthdayMonth - 1, C.birthdayDay);
      diff = Math.round((target - today) / 86400000);
    }
    return diff;
  }
  const diffDays = daysUntilBirthday();
  const isLocked = false; // TEST MODE: birthday lock disabled

  if(isLocked){
    document.getElementById('opening').style.display = 'none';
    const lockedField = document.getElementById('locked-starfield');
    for(let i=0;i<60;i++){
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random()*2.4 + 1;
      s.style.width = size+'px'; s.style.height = size+'px';
      s.style.left = Math.random()*100+'%';
      s.style.top = Math.random()*100+'%';
      s.style.animationDelay = (Math.random()*3.5)+'s';
      lockedField.appendChild(s);
    }
    const lc = document.getElementById('locked-countdown');
    lc.textContent = diffDays === 1
      ? "1 day left until your birthday ✨"
      : diffDays + " days left until your birthday ✨";
    document.body.style.overflow = 'hidden';
  } else {
    document.getElementById('locked-screen').style.display = 'none';
    initOpeningScreen();
  }

  function initOpeningScreen(){
  /* ---------- Opening screen ---------- */
  const starfield = document.getElementById('starfield');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2.4 + 1;
    s.style.width = size+'px'; s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    starfield.appendChild(s);
  }
  document.getElementById('open-line1').textContent = C.openingLine1;
  document.getElementById('open-line2').textContent = C.openingLine2;
  document.getElementById('enter-btn').textContent = C.openingButton;

  setTimeout(()=> document.getElementById('open-line1').classList.add('show'), 400);
  setTimeout(()=> document.getElementById('open-line2').classList.add('show'), 1500);
  setTimeout(()=> document.getElementById('enter-btn').classList.add('show'), 2500);
  }

  document.getElementById('enter-btn').addEventListener('click', () => {
    document.getElementById('opening').classList.add('hide');
    document.body.style.overflow = 'auto';
    launchFloaties();
    maybeShowMusicToast();
  });
  document.body.style.overflow = 'hidden';

  /* ---------- Scroll reveal (IntersectionObserver) ---------- */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); } });
  }, { threshold: 0.25 });
  document.querySelectorAll('.fade-section').forEach(el=>io.observe(el));

  /* ---------- SECTION 1: cake click ---------- */
  let cakeClicked = false;
  document.getElementById('cake-area').addEventListener('click', ()=>{
    burstConfetti(30);
    burstHearts(12);
    document.getElementById('reveal-message').classList.add('show');
    if(!cakeClicked){ cakeClicked = true; }
    else { burstConfetti(40); } // easter egg: extra confetti on repeat clicks
  });

  /* ---------- SECTION 2: why bunny cards ---------- */
  const whyGrid = document.getElementById('why-grid');
  C.whyBunnyCards.forEach((c, i)=>{
    const div = document.createElement('div');
    div.className = 'why-card';
    div.innerHTML = `<div class="emoji">${c.emoji}</div><div class="txt">${escapeHtml(c.text)}</div>`;
    whyGrid.appendChild(div);
  });
  const whyIO = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const cards = whyGrid.querySelectorAll('.why-card');
        cards.forEach((c,i)=> setTimeout(()=> c.classList.add('in'), i*140));
        whyIO.disconnect();
      }
    });
  }, {threshold:.3});
  whyIO.observe(whyGrid);

  /* ---------- SECTION 3: eyes button ---------- */
  document.getElementById('eyes-btn').addEventListener('click', function(){
    document.getElementById('eyes-reply').classList.add('show');
  });

  /* ---------- SECTION 4: cherish flip cards ---------- */
  const cherishGrid = document.getElementById('cherish-grid');
  C.cherishCards.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'flip-card';
    card.innerHTML = `<div class="flip-inner">
        <div class="flip-face flip-front">${escapeHtml(item.front)}</div>
        <div class="flip-face flip-back">${escapeHtml(item.back)}</div>
      </div>`;
    card.addEventListener('click', ()=> card.classList.toggle('flipped'));
    cherishGrid.appendChild(card);
  });

  /* ---------- SECTION 5: scrapbook ---------- */
  const scrapbook = document.getElementById('scrapbook');
  C.photos.forEach((p, idx)=>{
    const div = document.createElement('div');
    div.className = 'polaroid';
    div.innerHTML = `<div class="tape"></div>
      <div class="photo-box" data-idx="${idx}">🖼️</div>
      <div class="cap">${escapeHtml(p.caption||'')}</div>
      <div class="dt">${escapeHtml(p.date||'')}</div>`;
    scrapbook.appendChild(div);
    const box = div.querySelector('.photo-box');
    if(!p.image){
      box.textContent = '🐰';
      box.style.fontSize = '54px';
    } else {
      const img = new Image();
      img.onload = ()=>{ box.innerHTML=''; box.appendChild(img); };
      img.onerror = ()=>{ box.textContent = '🐰'; box.style.fontSize = '54px'; };
      img.src = p.image;
      img.alt = p.caption || '';
    }
    div.addEventListener('click', ()=> openLightbox(p));
  });
  function openLightbox(p){
    const lb = document.getElementById('lightbox');
    const im = document.getElementById('lb-img');
    if(!p.image){
      im.style.display = 'none';
    } else {
      im.src = p.image; im.alt = p.caption||'';
      im.onerror = ()=>{ im.style.display='none'; };
      im.onload = ()=>{ im.style.display='block'; };
    }
    document.getElementById('lb-cap').textContent = (p.caption||'') + (p.date? '  ·  '+p.date : '');
    lb.classList.add('open');
  }
  document.getElementById('lb-close').addEventListener('click', ()=> document.getElementById('lightbox').classList.remove('open'));
  document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') e.currentTarget.classList.remove('open'); });

  /* ---------- SECTION 6: reveal lines ---------- */
  const rl = document.getElementById('reveal-lines');
  C.throughEyesLines.forEach(line=>{
    const d = document.createElement('div');
    d.className = 'rl-line';
    d.textContent = line;
    rl.appendChild(d);
  });
  const rlIO = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const lines = rl.querySelectorAll('.rl-line');
        lines.forEach((l,i)=> setTimeout(()=> l.classList.add('in'), i*650));
        rlIO.disconnect();
      }
    });
  }, {threshold:.4});
  rlIO.observe(rl);

  /* ---------- SECTION 7: garden ---------- */
  const plot = document.getElementById('garden-plot');
  C.gardenFlowers.forEach(f=>{
    const wrap = document.createElement('div');
    wrap.innerHTML = `<button class="flower-btn"><span>${f.emoji}</span><span class="lbl">${escapeHtml(f.label)}</span></button>
      <div class="flower-wish">${escapeHtml(f.wish)}</div>`;
    const btn = wrap.querySelector('.flower-btn');
    const wishEl = wrap.querySelector('.flower-wish');
    btn.addEventListener('click', ()=>{
      const already = btn.classList.contains('bloomed');
      btn.classList.toggle('bloomed');
      wishEl.classList.toggle('show');
      if(!already) burstHearts(4);
    });
    plot.appendChild(wrap);
  });

  /* ---------- SECTION 8: how well I know you (tap to reveal) ---------- */
  setText('quiz-intro-text', C.quizIntro || '');
  const qaList = document.getElementById('qa-list');
  C.quizQuestions.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'qa-card';
    card.innerHTML = `<div class="qa-q"><span>${escapeHtml(item.q)}</span><span class="chev">▾</span></div>
      <div class="qa-a">${escapeHtml(item.a)}</div>`;
    card.addEventListener('click', ()=> card.classList.toggle('open'));
    qaList.appendChild(card);
  });
  document.getElementById('quiz-final').style.display = 'block';
  setText('quiz-result-text', C.quizResult);
  setText('quiz-followup-text', C.quizFollowup);
  setText('quiz-tell-btn', C.quizButton);
  document.getElementById('quiz-tell-btn').addEventListener('click', ()=>{
    setText('quiz-reveal-text', C.quizReveal);
    document.getElementById('quiz-reveal-text').classList.add('show');
    burstHearts(10);
  });

  /* ---------- SECTION 9: wishes ---------- */
  const wishWrap = document.getElementById('wish-stars');
  C.wishesList.forEach(w=>{
    const d = document.createElement('div');
    d.className = 'wish-star';
    d.innerHTML = `<span class="glyph">✨</span>${escapeHtml(w)}`;
    wishWrap.appendChild(d);
  });
  const wishIO = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const stars = wishWrap.querySelectorAll('.wish-star');
        stars.forEach((s,i)=> setTimeout(()=> s.classList.add('in'), i*420));
        wishIO.disconnect();
      }
    });
  }, {threshold:.3});
  wishIO.observe(wishWrap);

  /* ---------- SECTION 10: secret box ---------- */
  document.getElementById('box-btn').addEventListener('click', function(){
    const visual = document.getElementById('box-visual');
    visual.textContent = '🎉';
    visual.classList.add('opened');
    burstConfetti(50); burstHearts(16);
    const msg = document.getElementById('box-message');
    msg.innerHTML = `${escapeHtml(C.secretMessage1)}<br><br>${escapeHtml(C.secretMessage2)}`;
    msg.classList.add('show');
    this.disabled = true;
  });

  /* ---------- Confetti / hearts effects ---------- */
  const fxLayer = document.getElementById('fx-layer');
  const confettiColors = ['#F7D9E3','#E3D6F5','#D6E7F7','#CBA35C','#fff'];
  function burstConfetti(n){
    if(reduceMotion) return;
    for(let i=0;i<n;i++){
      const bit = document.createElement('div');
      bit.className = 'confetti-bit';
      bit.style.left = Math.random()*100+'vw';
      bit.style.background = confettiColors[Math.floor(Math.random()*confettiColors.length)];
      bit.style.animationDuration = (2 + Math.random()*1.5)+'s';
      bit.style.transform = `rotate(${Math.random()*360}deg)`;
      fxLayer.appendChild(bit);
      setTimeout(()=> bit.remove(), 4000);
    }
  }
  function burstHearts(n){
    if(reduceMotion) return;
    const hearts = ['💗','💕','🤍','✨'];
    for(let i=0;i<n;i++){
      const h = document.createElement('div');
      h.className = 'heart-bit';
      h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
      h.style.left = Math.random()*100+'vw';
      h.style.setProperty('--drift', (Math.random()*60-30)+'px');
      h.style.animationDuration = (3+Math.random()*2)+'s';
      fxLayer.appendChild(h);
      setTimeout(()=> h.remove(), 5500);
    }
  }

  /* ---------- Floating background particles (subtle, ambient) ---------- */
  function launchFloaties(){
    if(reduceMotion) return;
    const layer = document.getElementById('particle-layer');
    const glyphs = ['✨','🌸','⭐'];
    setInterval(()=>{
      if(document.hidden) return;
      const f = document.createElement('div');
      f.className = 'floaty';
      f.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
      f.style.left = Math.random()*100+'vw';
      f.style.bottom = '-30px';
      f.style.fontSize = (10+Math.random()*10)+'px';
      f.style.animationDuration = (10+Math.random()*8)+'s';
      layer.appendChild(f);
      setTimeout(()=> f.remove(), 19000);
    }, 2200);
  }

  /* ---------- Music ---------- */
  const bgm = document.getElementById('bgm');
  bgm.src = C.musicFile;
  let musicOn = false;
  let toastShown = false;
  const musicBtn = document.getElementById('music-btn');
  const musicToast = document.getElementById('music-toast');
  musicToast.textContent = C.musicPrompt;
  function maybeShowMusicToast(){
    if(toastShown) return;
    toastShown = true;
    setTimeout(()=>{
      musicToast.classList.add('show');
      setTimeout(()=> musicToast.classList.remove('show'), 5000);
    }, 1200);
  }
  musicBtn.addEventListener('click', ()=>{
    musicOn = !musicOn;
    if(musicOn){
      bgm.play().catch(()=>{ /* file may be missing — fail silently */ });
      musicBtn.classList.add('playing');
      musicBtn.textContent = '🎶';
    } else {
      bgm.pause();
      musicBtn.classList.remove('playing');
      musicBtn.textContent = '🎵';
    }
    musicToast.classList.remove('show');
  });

  /* ---------- Easter eggs ---------- */
  // 1. click bunny emoji 5x -> dance
  let bunnyClicks = 0;
  const openingBunny = document.querySelector('.opening-bunny');
  openingBunny.addEventListener('click', ()=>{
    bunnyClicks++;
    if(bunnyClicks>=5){
      openingBunny.style.animation = 'bunny-bob .3s ease-in-out infinite';
      bunnyClicks = 0;
    }
  });

  // 2. click a star -> turns into heart
  starfield.addEventListener('click', (e)=>{
    if(e.target.classList.contains('star')){
      e.target.textContent = '';
      e.target.style.background = 'transparent';
      e.target.style.fontSize = '14px';
      e.target.textContent = '💗';
      e.target.style.width = 'auto'; e.target.style.height='auto';
    }
  });

  // 3. double-click the moon -> secret message
  document.getElementById('wishes-title').addEventListener('dblclick', ()=>{
    alert("Psst… you weren't supposed to find this. But since you did: I hope this year treats you exactly the way you deserve. 🌙");
  });

  // 4. cake click already gives extra confetti on repeat (see above)

  // 5. type BUNNY -> secret screen
  let typed = '';
  window.addEventListener('keydown', (e)=>{
    if(e.key.length===1){
      typed += e.key.toUpperCase();
      if(typed.length>10) typed = typed.slice(-10);
      if(typed.includes('BUNNY')){
        document.getElementById('secret-screen').classList.add('open');
        typed='';
      }
    }
    // Ctrl+E: quick reminder of where to edit (documented "edit mode")
    if(e.ctrlKey && e.key.toLowerCase()==='e'){
      e.preventDefault();
      alert('Edit mode: open this HTML file in any text editor and look for the CONFIG object near the top — every name, message, photo, wish, and color lives there.');
    }
  });
  document.getElementById('close-secret').addEventListener('click', ()=>{
    document.getElementById('secret-screen').classList.remove('open');
  });

  /* ---------- Utility ---------- */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
})();
</script>
</body>
</html>
